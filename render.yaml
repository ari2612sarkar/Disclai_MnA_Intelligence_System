services:
  - type: web
    name: disclai
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn app.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: HF_API_KEY
        sync: false
      - key: HF_MODEL_ID
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./disclai.db
      - key: ENABLE_EMBEDDINGS
        value: "false"
      - key: LOG_LEVEL
        value: INFO
